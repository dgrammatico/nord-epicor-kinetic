<!doctype html>
<html><head><style>
html,body{margin:0;background:var(--surface-page)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--surface-page);font-family:var(--font-sans)}
.cv-art{position:absolute;inset:0}
.accent{fill:var(--accent)} .icon{fill:var(--icon)} .teal{fill:var(--accent-hover)} .strong{fill:var(--surface-strong)} .warning{fill:var(--warning)}
.tile{fill:var(--surface-hover)} .dot{fill:var(--icon);opacity:.55}
.lg{rx:var(--radius-lg)} .md{rx:var(--radius-md)}
.cv-text{position:absolute;left:40px;bottom:36px;max-width:440px}
.cv-name{margin:0;font-size:72px;line-height:.95;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.cv-tag{margin:14px 0 0;font-size:14px;line-height:20px;color:var(--text-muted)}
</style></head><body>
<div class="cv">
<svg class="cv-art" viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
<!-- blocks: accent 186x138, icon 90x90, accent-hover 90x42 + 138x42, surface-strong 138x90, warning 42x42 (radius-lg)
     arrangement: flush modular grid at a 48px pitch (space-6 x2) with space-1.5 gutters, right of x=480
     pattern: "geometric, modular, dense UI" — empty cells become surface-hover tiles and dots cut by radius-md, like the toolbar hover boxes
     scales: pitch 48 = 2 x space-6, gutter space-1.5 (6px), radii radius-md (tiles) and radius-lg (blocks) -->
<rect class="accent lg" x="552" y="24" width="186" height="138"/><rect class="icon lg" x="744" y="72" width="90" height="90"/><rect class="teal lg" x="840" y="24" width="90" height="42"/><rect class="strong lg" x="504" y="168" width="138" height="90"/><rect class="teal lg" x="792" y="168" width="138" height="42"/><rect class="warning lg" x="696" y="216" width="42" height="42"/>
<rect class="tile md" x="504" y="24" width="42" height="42"/><rect class="dot md" x="519" y="87" width="12" height="12"/><rect class="tile md" x="504" y="120" width="42" height="42"/><rect class="tile md" x="648" y="168" width="42" height="42"/><rect class="dot md" x="663" y="231" width="12" height="12"/><rect class="dot md" x="711" y="183" width="12" height="12"/><rect class="dot md" x="759" y="39" width="12" height="12"/><rect class="tile md" x="744" y="168" width="42" height="42"/><rect class="dot md" x="759" y="231" width="12" height="12"/><rect class="tile md" x="792" y="24" width="42" height="42"/><rect class="tile md" x="792" y="216" width="42" height="42"/><rect class="tile md" x="840" y="72" width="42" height="42"/><rect class="dot md" x="855" y="135" width="12" height="12"/><rect class="dot md" x="855" y="231" width="12" height="12"/><rect class="dot md" x="903" y="87" width="12" height="12"/><rect class="tile md" x="888" y="120" width="42" height="42"/><rect class="tile md" x="888" y="216" width="42" height="42"/>
</svg>
<div class="cv-text"><h1 class="cv-name">Nord Polar<br>Night</h1><p class="cv-tag">Calm, polished dark UI for dense business software.</p></div>
</div>
</body></html>
